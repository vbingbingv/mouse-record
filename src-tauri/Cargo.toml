[package]
name = "mouse-record"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mouse_record_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 的事件源（cgtap）与回放投递（cgpost）直接使用 CGEvent；
# highsierra 起才提供 new_scroll_event（滚轮的像素级回放依赖它）。
# rdev 只在 Windows 编译，两者不再共享类型，因此不锁版本对齐。
core-graphics = { version = "0.25", features = ["highsierra"] }

# rdev 0.5.3 在 macOS 上丢弃拖拽移动与中键事件，仅作为 Windows 事件源
[target.'cfg(target_os = "windows")'.dependencies]
rdev = "0.5"
# 回放后端：macOS 改用自建的 CGEvent 投递（input/cgpost.rs），
# enigo 只服务 Windows，避免它的 macOS 坐标问题进到 mac 构建里
enigo = "0.2"

